<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CreativeWork",
  "@id": {{ page.url | absolute_url | jsonify }},
  "name": {{ page.title | jsonify }},
  "description": {{ page.summary | jsonify }},
  "creator": { "@id": {{ '/#me' | absolute_url | jsonify }} },
  {% if page.repo and page.repo != "" %}"codeRepository": {{ page.repo | jsonify }},{% endif %}
  {% if page.start %}"dateCreated": {{ page.start | jsonify }},{% endif %}
  "keywords": {{ page.standards | concat: page.tags | compact | jsonify }}
}
</script>
