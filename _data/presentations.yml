- title: "Identity in Context Across Metadata Styles"
  event: "DCMI 2026, Seoul"
  when: "August 3, 2026"
  year: 2026
  type: "Keynote"
  copresenters: ["Tom Baker (DCMI)", "Niklas Lindström (National Library of Sweden)"]
  initiative: wikidata
  featured: true
  description: >-
    Traces a single editor attribution from catalog cards and MARC through BIBFRAME,
    Libris, Dublin Core, DataCite, and the DCMI Scholarly Resources Application Profile,
    arguing that precision of identity matters more than richness of detail for
    interoperability, and showing how RDF, application profiles, and AI can translate
    between metadata styles.

