experience:
  - org: "Stanford University Libraries"
    title: "Authorities & Entity Management Librarian"
    dates: "February 2025–present"
    location: "Hybrid on-site"
    description: >-
      Manages MARC authority data for Stanford University Libraries. Helps advance the production
      of linked open data cataloging within Stanford University Libraries and beyond by serving as
      a Sinopia administrator, developing and delivering staff training, and collaborating across
      departments and professional communities. Serves as Product Owner and Project Manager for
      Blue Core, and participates in planning for new metadata and technical service workflows.
      Collaborates closely with developers on metadata systems and workflow design. Works with
      Sinopia users to fine-tune templates and receive feedback for development and future
      projects. Supports Open Metadata policy and initiatives, and facilitates the routine deposit
      of CC0 licensed bibliographic metadata to the Stanford Repository.
  - org: "Stanford University Libraries"
    title: "Linked Data Community Outreach Librarian"
    dates: "October 2023–February 2025"
    location: "Remote"
    description: >-
      Helped advance the production of linked open data cataloging within Stanford University
      Libraries and beyond by serving as a Sinopia administrator, and collaborating across
      departments and professional communities. Served as Project Manager for Blue Core, and
      participated in project planning for new metadata and technical service workflows. Worked
      with Sinopia users to fine-tune templates and receive feedback for development and future
      projects.
  - org: "Teachers College, Columbia University"
    title: "Head of Technical Services and Metadata Librarian"
    dates: "March 2021–September 2023"
    location: "New York, NY"
    description: >-
      Responsible for collections operations and acquisitions, cataloging and metadata, library
      systems administration, ARL statistics and collection statistics, course reserves,
      interlibrary loan, electronic resource management, and technical services areas. Provided
      strategic planning for library and College-wide metadata workflows, projects, and grants.
  - org: "Teachers College, Columbia University"
    title: "Acquisitions and Materials Librarian"
    dates: "September 2018–January 2021"
    location: "New York, NY"
    description: >-
      Responsible for managing a patron-driven acquisitions program, interlibrary loan, metadata
      workflows, electronic resources, and a homegrown document delivery system and service for
      library acquisitions. Assisted with gathering collections statistics for annual ARL reporting.
  - org: "Brooklyn Public Library"
    title: "Library Information Supervisor"
    dates: "2017–2018"
    location: "Brooklyn, NY"
    description: >-
      Managing librarian responsible for general branch operations including staff scheduling,
      performance reviews, program development, and customer service with a specialization in
      children's services and programming.
  - org: "Brooklyn Public Library"
    title: "School Outreach Librarian"
