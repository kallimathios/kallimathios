# ------------------------------------------------------------------
# Site settings: edit these first
# ------------------------------------------------------------------
title: "Kalliopi M. Mathios"
tagline: "Authorities & Entity Management Librarian"
description: >-
  Portfolio of Kalliopi Mathios, a metadata librarian with deep systems knowledge specializing in RDF-based vocabularies for library resources, linked data modeling, and metadata infrastructure for research libraries.
lang: en
url: "https://kallimathios.github.io"   # or your custom domain, e.g. https://yourname.net
baseurl: "/kallimathios"                         # "" for a user site or custom domain; "/repo-name" for a project site

author:
  name: "Kalli Mathios"
  job_title: "Authorities & Entity Management Librarian"
  organization: "Stanford University"
  organization_url: "https://library.stanford.edu/"
  email: "kmathios@stanford.edu"
  headshot: ""   # e.g. "/assets/img/headshot.jpg"; leave blank to hide
  orcid: "0009-0006-9294-742X"
  wikidata: ""
  github: "kallimathios"
  linkedin: "www.linkedin.com/in/kalliopi-mathios-16b4471bp"                            # profile slug, e.g. "your-name"
  knows_about:
    - "Resource Description Framework (RDF)"
    - "BIBFRAME"
    - "MADS/RDF"
    - "Dublin Core Metadata Terms"
    - "SHACL"
    - "SKOS"
    - "SPARQL"
    - "Wikidata"
    - "Linked data"

# Three focus areas shown as cards on the home page
focus_areas:
  - title: "Linked data modeling"
    text: "Designing RDF models and application profiles that make library description reusable on the open web."
    color: lagunita
  - title: "Metadata transformation"
    text: "Moving legacy library metadata (MARC) into BIBFRAME and other RDF vocabularies at scale."
    color: palo-verde-dark
  - title: "Quality & validation"
    text: "Using SHACL and SPARQL to keep linked data consistent, valid, and trustworthy."
    color: plum

# Show the Stanford global footer links (see README before enabling on a personal site)
stanford_global_footer: false

# ------------------------------------------------------------------
# Build settings: usually no need to change
# ------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: projects }
    values: { layout: project }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - SITEMAP.md
  - Gemfile
  - Gemfile.lock
  - vendor
